<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">NVFP4 量化与反量化图解</title>
  <desc id="desc">输入张量先使用 FP32 全局尺度归一化，再按每 16 元素计算 E4M3 局部尺度，元素量化为 E2M1，反量化时三个部分相乘。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2476a8"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#17324a}.title{font-size:27px;font-weight:700;fill:#075789}.label{font-size:19px;font-weight:600}.small{font-size:16px}.note{font-size:15px;fill:#486176}.box{fill:#eef6fb;stroke:#6ea6c8;stroke-width:2}.scale{fill:#fff3d8;stroke:#d89a25;stroke-width:2}.code{fill:#eaf5ec;stroke:#66a978;stroke-width:2}.arrow{stroke:#2476a8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="40" y="42" class="title">NVFP4：16 元素微块 + 两级尺度</text>
  <rect x="42" y="78" width="170" height="72" rx="9" class="box"/><text x="127" y="108" text-anchor="middle" class="label">输入张量 X</text><text x="127" y="134" text-anchor="middle" class="small">BF16 / FP32</text>
  <path d="M212 114 H275" class="arrow"/>
  <rect x="278" y="70" width="190" height="88" rx="9" class="scale"/><text x="373" y="101" text-anchor="middle" class="label">FP32 Tensor scale</text><text x="373" y="128" text-anchor="middle" class="small">由全局 amax 决定</text><text x="373" y="149" text-anchor="middle" class="note">先归一化整个张量</text>
  <path d="M468 114 H530" class="arrow"/>
  <rect x="533" y="70" width="200" height="88" rx="9" class="scale"/><text x="633" y="101" text-anchor="middle" class="label">E4M3 block scale</text><text x="633" y="128" text-anchor="middle" class="small">每连续 16 元素一个</text><text x="633" y="149" text-anchor="middle" class="note">局部 amax / 6</text>
  <path d="M733 114 H795" class="arrow"/>
  <rect x="798" y="70" width="160" height="88" rx="9" class="code"/><text x="878" y="101" text-anchor="middle" class="label">E2M1 元素</text><text x="878" y="128" text-anchor="middle" class="small">4 bit / value</text><text x="878" y="149" text-anchor="middle" class="note">舍入并夹紧</text>
  <text x="42" y="205" class="label">分块示意</text>
  <g transform="translate(42,225)">
    <rect x="0" y="0" width="210" height="78" rx="8" class="box"/><text x="105" y="29" text-anchor="middle" class="label">Block 0</text><text x="105" y="56" text-anchor="middle" class="small">元素 0～15 · E4M3 scale₀</text>
    <rect x="228" y="0" width="210" height="78" rx="8" class="box"/><text x="333" y="29" text-anchor="middle" class="label">Block 1</text><text x="333" y="56" text-anchor="middle" class="small">元素 16～31 · E4M3 scale₁</text>
    <rect x="456" y="0" width="210" height="78" rx="8" class="box"/><text x="561" y="29" text-anchor="middle" class="label">Block 2</text><text x="561" y="56" text-anchor="middle" class="small">元素 32～47 · E4M3 scale₂</text>
    <rect x="684" y="0" width="210" height="78" rx="8" class="box"/><text x="789" y="29" text-anchor="middle" class="label">Block 3</text><text x="789" y="56" text-anchor="middle" class="small">元素 48～63 · E4M3 scale₃</text>
  </g>
  <rect x="145" y="340" width="710" height="62" rx="10" class="code"/><text x="500" y="369" text-anchor="middle" class="label">反量化：x̂ᵢ = E2M1ᵢ × E4M3 block scale × FP32 tensor scale</text><text x="500" y="391" text-anchor="middle" class="note">同一个 64 元素范围中保留了 4 个独立的局部尺度</text>
</svg>
