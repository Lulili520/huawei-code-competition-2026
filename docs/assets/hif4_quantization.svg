<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">HiF4 量化与反量化图解</title>
  <desc id="desc">一个 64 元素 HiF4 单元共享 E6M2 基础尺度，分成 8 个八元素组，每组有二级一比特微尺度，并进一步分成两个四元素组，每组有三级一比特微尺度，最终元素使用 S1P2。</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2476a8"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#17324a}.title{font-size:27px;font-weight:700;fill:#075789}.label{font-size:18px;font-weight:600}.small{font-size:15px}.note{font-size:14px;fill:#486176}.root{fill:#fff3d8;stroke:#d89a25;stroke-width:2}.lv2{fill:#e8f2fb;stroke:#6a9fc2;stroke-width:2}.lv3{fill:#edf7ef;stroke:#69a878;stroke-width:1.8}.mant{fill:#f4effb;stroke:#9071b8;stroke-width:1.8}.line{stroke:#2476a8;stroke-width:2;fill:none}.arrow{stroke:#2476a8;stroke-width:2.5;fill:none;marker-end:url(#arrow2)}
    </style>
  </defs>
  <text x="40" y="42" class="title">HiF4：64 → 8 → 4 的三级缩放树</text>
  <rect x="335" y="68" width="330" height="68" rx="10" class="root"/><text x="500" y="97" text-anchor="middle" class="label">1 个 E6M2 基础 scale</text><text x="500" y="121" text-anchor="middle" class="small">覆盖整个 64 元素单元</text>
  <path d="M500 136 V165 M82 165 H918" class="line"/>
  <g transform="translate(42,172)">
    <g><path d="M40 -7 V0" class="line"/><rect x="0" y="0" width="94" height="55" rx="7" class="lv2"/><text x="47" y="23" text-anchor="middle" class="label">lv2₀</text><text x="47" y="44" text-anchor="middle" class="small">×1 / ×2</text></g>
    <g transform="translate(116,0)"><path d="M47 -7 V0" class="line"/><rect width="94" height="55" rx="7" class="lv2"/><text x="47" y="23" text-anchor="middle" class="label">lv2₁</text><text x="47" y="44" text-anchor="middle" class="small">×1 / ×2</text></g>
    <g transform="translate(232,0)"><path d="M47 -7 V0" class="line"/><rect width="94" height="55" rx="7" class="lv2"/><text x="47" y="23" text-anchor="middle" class="label">lv2₂</text><text x="47" y="44" text-anchor="middle" class="small">×1 / ×2</text></g>
    <g transform="translate(348,0)"><path d="M47 -7 V0" class="line"/><rect width="94" height="55" rx="7" class="lv2"/><text x="47" y="23" text-anchor="middle" class="label">lv2₃</text><text x="47" y="44" text-anchor="middle" class="small">×1 / ×2</text></g>
    <g transform="translate(464,0)"><path d="M47 -7 V0" class="line"/><rect width="94" height="55" rx="7" class="lv2"/><text x="47" y="23" text-anchor="middle" class="label">lv2₄</text><text x="47" y="44" text-anchor="middle" class="small">×1 / ×2</text></g>
    <g transform="translate(580,0)"><path d="M47 -7 V0" class="line"/><rect width="94" height="55" rx="7" class="lv2"/><text x="47" y="23" text-anchor="middle" class="label">lv2₅</text><text x="47" y="44" text-anchor="middle" class="small">×1 / ×2</text></g>
    <g transform="translate(696,0)"><path d="M47 -7 V0" class="line"/><rect width="94" height="55" rx="7" class="lv2"/><text x="47" y="23" text-anchor="middle" class="label">lv2₆</text><text x="47" y="44" text-anchor="middle" class="small">×1 / ×2</text></g>
    <g transform="translate(812,0)"><path d="M47 -7 V0" class="line"/><rect width="94" height="55" rx="7" class="lv2"/><text x="47" y="23" text-anchor="middle" class="label">lv2₇</text><text x="47" y="44" text-anchor="middle" class="small">×1 / ×2</text></g>
  </g>
  <text x="500" y="253" text-anchor="middle" class="note">8 个 lv2，每个控制连续 8 元素；下面只展开第 0 组，其余 7 组结构相同</text>
  <path d="M89 227 V282 M89 282 H319" class="line"/>
  <rect x="55" y="292" width="220" height="62" rx="8" class="lv3"/><text x="165" y="320" text-anchor="middle" class="label">lv3₀：元素 0～3</text><text x="165" y="343" text-anchor="middle" class="small">微尺度 ×1 / ×2</text>
  <rect x="295" y="292" width="220" height="62" rx="8" class="lv3"/><text x="405" y="320" text-anchor="middle" class="label">lv3₁：元素 4～7</text><text x="405" y="343" text-anchor="middle" class="small">微尺度 ×1 / ×2</text>
  <path d="M165 354 V379 M405 354 V379" class="arrow"/>
  <rect x="55" y="385" width="220" height="55" rx="8" class="mant"/><text x="165" y="408" text-anchor="middle" class="label">4 个 S1P2 元素</text><text x="165" y="430" text-anchor="middle" class="small">0～1.75，步长 0.25</text>
  <rect x="295" y="385" width="220" height="55" rx="8" class="mant"/><text x="405" y="408" text-anchor="middle" class="label">4 个 S1P2 元素</text><text x="405" y="430" text-anchor="middle" class="small">0～1.75，步长 0.25</text>
  <rect x="570" y="292" width="375" height="148" rx="10" class="root"/><text x="757" y="323" text-anchor="middle" class="label">单个元素的反量化路径</text><text x="757" y="361" text-anchor="middle" class="label">x̂ᵢ = sign × mant</text><text x="757" y="389" text-anchor="middle" class="label">× E6M2 × lv2 × lv3</text><text x="757" y="421" text-anchor="middle" class="note">1.75 × 2 × 2 = 7（局部最大倍率）</text>
  <text x="500" y="475" text-anchor="middle" class="note">关键差异：NVFP4 的 4 个 per-16 scale，必须重新组织成 HiF4 的 1 个根 scale + 8 个 lv2 + 16 个 lv3</text>
</svg>
